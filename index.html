<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="note-container">
        <div class="content-note">
            <div style="text-align: center; font-size: 20px; font-family: 'Courier New', Courier, monospace; color: white; padding: 10px;">Calcular Robux</div>
            <div>Robux Completos</div>
            <input type="number" id="calc1" style="padding: 5px; border-radius: 10px;" placeholder="Envias (Gamepass)">
            <div>Robux Recibidos</div>
            <input type="number" id="calc2" style="padding: 5px; border-radius: 10px;" placeholder="Recibes">
        </div>
        <div class="content-note">
            <div style="text-align: center; font-size: 20px; font-family: 'Courier New', Courier, monospace; color: white; padding: 10px;">Calcular Precios</div>
            <div>Cantidad Robux</div>
            <input type="number" id="calc3" style="padding: 5px; border-radius: 10px;" placeholder="Robux">
            <div>Precio</div>
            <input type="number" id="calc4" style="padding: 5px; border-radius: 10px;" placeholder="Valor">
            <div>Proveedor</div>
            <select id="proveedor" style="padding: 5px; border-radius: 10px;">
                <option id="option1">Roblox</option>
                <option id="option2">Sh4rkie Studio</option>
                <option id="option3">UnitXPress</option>
            </select>
            <div>Moneda: </div>
            <select id="moneda" style="padding: 5px; border-radius: 10px;">
                <option value="COP">COP</option>
                <option value="USD">USD</option>
                <option value="CLP">CLP</option>
                <option value="BRL">BRL</option>
                <option value="MXN">MXN</option>
                <option value="PEN">PEN</option>
            </select>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
