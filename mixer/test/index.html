
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Buscador musical</title>
</head>
<body>
    <h2>Buscador musical</h2>

    <input
        id="busqueda"
        type="text"
        placeholder="Canción, artista o enlace..."
        style="width:300px"
    >

    <button id="buscar">Buscar / Reproducir</button>

    <p id="estado">Escribe una canción o pega un enlace.</p>

    <div id="resultados"></div>

    <h3 id="titulo">Reproductor</h3>

    <div id="reproductor"></div>

    <audio id="preview" controls style="width:350px; display:none"></audio>

    <script src="script.js"></script>
</body>
</html>
