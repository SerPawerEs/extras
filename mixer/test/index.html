<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador YouTube Interno</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f0f0f; color: #fff; padding: 20px; text-align: center; }
        .buscador-box { margin-bottom: 20px; }
        input { padding: 12px; width: 60%; max-width: 400px; font-size: 16px; border-radius: 4px 0 0 4px; border: none; outline: none; }
        button { padding: 12px 20px; font-size: 16px; background: #ff0000; color: white; border: none; border-radius: 0 4px 4px 0; cursor: pointer; }
        #visor { width: 100%; max-width: 800px; height: 450px; margin: 0 auto; border-radius: 12px; overflow: hidden; background: #212121; display: none; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <h2>Buscador en la misma página</h2>
    
    <div class="buscador-box">
        <input type="text" id="query" placeholder="Escribe qué quieres ver...">
        <button onclick="buscar()">Buscar</button>
    </div>

    <!-- Contenedor donde se mostrará el reproductor -->
    <div id="visor">
        <iframe id="ytFrame" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>

    <script>
        function buscar() {
            const texto = document.getElementById('query').value.trim();
            if (!texto) return;

            // Truco: Como YouTube no deja hacer fetch directo, usamos el embed de búsqueda o lista 
            // que sí renderiza los videos directamente dentro de tu página sin errores de CORS.
            const visor = document.getElementById('visor');
            const iframe = document.getElementById('ytFrame');
            
            // Carga la vista de resultados interactiva embebida de YouTube
            iframe.src = `https://www.youtube.com/embed?listType=search&list=${encodeURIComponent(texto)}`;
            visor.style.display = 'block';
        }
    </script>
</body>
</html>
