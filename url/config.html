<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Configurar URL</title>

    <!-- ======================== FIREBASE SDK ======================== -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0d1117 0%, #161b22 50%, #1a1a2e 100%);
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 30% 40%, rgba(56, 139, 253, 0.06) 0%, transparent 50%),
                radial-gradient(circle at 70% 60%, rgba(188, 100, 255, 0.05) 0%, transparent 50%);
        }

        .admin-card {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 50px 45px;
            width: 90%;
            max-width: 520px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .admin-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .admin-header .icon {
            font-size: 2.5rem;
            margin-bottom: 12px;
        }

        .admin-header h2 {
            color: rgba(255, 255, 255, 0.9);
            font-weight: 400;
            font-size: 1.5rem;
            letter-spacing: 1px;
        }

        .admin-header p {
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.85rem;
            margin-top: 8px;
        }

        /* ---- Campo de URL ---- */
        .input-group {
            margin-bottom: 25px;
        }

        .input-group label {
            display: block;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 18px;
            font-size: 1rem;
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            outline: none;
            transition: all 0.3s;
            font-family: inherit;
        }
        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        .input-group input:focus {
            border-color: rgba(56, 139, 253, 0.5);
            box-shadow: 0 0 20px rgba(56, 139, 253, 0.1);
            background: rgba(255, 255, 255, 0.07);
        }

        /* ---- URL actual ---- */
        .current-url {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 14px 18px;
            margin-bottom: 30px;
            min-height: 48px;
        }

        .current-url .label {
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .current-url .value {
            color: rgba(100, 200, 255, 0.7);
            font-size: 0.9rem;
            word-break: break-all;
            font-family: 'Courier New', monospace;
        }

        /* ---- Botones ---- */
        .btn-row {
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;
            padding: 14px 20px;
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            border: none;
            border-radius: 12px;            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .btn-save {
            color: #fff;
            background: linear-gradient(135deg, #388bfd, #6e40c9);
            opacity: 0.9;
        }

        .btn-save:hover {
            opacity: 1;
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(56, 139, 253, 0.25);
        }

        .btn-save:active {
            transform: translateY(0);
        }

        .btn-clear {
            color: rgba(255, 255, 255, 0.6);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            flex: 0.5;
        }

        .btn-clear:hover {
            background: rgba(255, 100, 100, 0.1);
            border-color: rgba(255, 100, 100, 0.2);
            color: rgba(255, 150, 150, 0.8);
        }

        /* ---- Toast / Notificación ---- */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 0.9rem;
            color: #fff;
            backdrop-filter: blur(10px);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 100;
            pointer-events: none;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .toast.success {
            background: rgba(46, 160, 67, 0.85);
            border: 1px solid rgba(46, 160, 67, 0.4);
        }

        .toast.error {
            background: rgba(218, 54, 51, 0.85);
            border: 1px solid rgba(218, 54, 51, 0.4);
        }

        .toast.info {
            background: rgba(56, 139, 253, 0.85);
            border: 1px solid rgba(56, 139, 253, 0.4);
        }

        /* ---- Indicador de conexión ---- */
        .connection-status {
            text-align: center;
            margin-top: 25px;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.2);
        }

        .connection-status .dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: middle;
        }

        .connection-status .dot.online  { background: #3fb950; box-shadow: 0 0 6px #3fb950; }
        .connection-status .dot.offline { background: #f85149; box-shadow: 0 0 6px #f85149; }
    </style>
</head>
<body>

    <div class="admin-card">
        <div class="admin-header">
            <div class="icon">⚙️</div>
            <h2>Panel de Administración</h2>
            <p>Configura la URL de redirección</p>
        </div>

        <!-- URL actualmente almacenada -->        <div class="current-url">
            <div class="label">URL almacenada actualmente</div>
            <div id="currentUrl" class="value">Cargando...</div>
        </div>

        <!-- Input para nueva URL -->
        <div class="input-group">
            <label for="newUrl">Nueva URL</label>
            <input
                type="url"
                id="newUrl"
                placeholder="https://ejemplo.com"
                autocomplete="off"
            >
        </div>

        <!-- Botones -->
        <div class="btn-row">
            <button class="btn btn-clear" onclick="clearUrl()">Limpiar</button>
            <button class="btn btn-save"   onclick="saveUrl()">Guardar URL</button>
        </div>

        <!-- Estado de conexión -->
        <div class="connection-status">
            <span id="connDot" class="dot offline"></span>
            <span id="connText">Conectando...</span>
        </div>
    </div>

    <!-- Toast de notificación -->
    <div id="toast" class="toast"></div>

    <script>
        // ============================================================
        //  🔧 CONFIGURACIÓN DE FIREBASE
        //  Usa LOS MISMOS valores que en index.html
        // ============================================================
        const firebaseConfig = {
          apiKey: "AIzaSyC9L0YQb9wqaDjETUE0RKzdOA8DAr94jog",
          authDomain: "modificableurl.firebaseapp.com",
          databaseURL: "https://modificableurl-default-rtdb.firebaseio.com",
          projectId: "modificableurl",
          storageBucket: "modificableurl.firebasestorage.app",
          messagingSenderId: "666830731244",
          appId: "1:666830731244:web:85ba4c74a4a863bb51f2c9",
          measurementId: "G-QJJEV9Y6PS"
        };

        // ============================================================
        //  🔧 MISMO NODO que en index.html
        // ============================================================        
        const DATABASE_PATH = "redirect/url";

        // ============================================================
        //  INICIALIZACIÓN
        // ============================================================
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const currentUrlEl = document.getElementById('currentUrl');
        const newUrlInput  = document.getElementById('newUrl');
        const connDot      = document.getElementById('connDot');
        const connText     = document.getElementById('connText');

        // --- Escuchar URL en tiempo real ---
        db.ref(DATABASE_PATH).on('value', (snapshot) => {
            const url = snapshot.val();
            currentUrlEl.textContent = url || '— Sin configurar —';
        }, (error) => {
            currentUrlEl.textContent = 'Error de lectura';
            showToast('Error al leer Firebase: ' + error.message, 'error');
        });

        // --- Guardar URL ---
        function saveUrl() {
            let url = newUrlInput.value.trim();

            if (!url) {
                showToast('Escribe una URL primero', 'error');
                return;
            }

            // Agregar https:// si no tiene protocolo
            if (!/^https?:\/\//i.test(url)) {
                url = 'https://' + url;
            }

            db.ref(DATABASE_PATH).set(url)
                .then(() => {
                    showToast('✅ URL actualizada correctamente', 'success');
                    newUrlInput.value = '';
                })
                .catch((err) => {
                    showToast('❌ Error: ' + err.message, 'error');
                });
        }

        // --- Limpiar URL ---
        function clearUrl() {
            db.ref(DATABASE_PATH).remove()
                .then(() => {                    showToast('🗑️ URL eliminada', 'info');
                    newUrlInput.value = '';
                })
                .catch((err) => {
                    showToast('❌ Error: ' + err.message, 'error');
                });
        }

        // --- Toast ---
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type + ' show';
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // --- Estado de conexión ---
        db.ref('.info/connected').on('value', (snapshot) => {
            if (snapshot.val() === true) {
                connDot.className = 'dot online';
                connText.textContent = 'Conectado a Firebase';
            } else {
                connDot.className = 'dot offline';
                connText.textContent = 'Desconectado';
            }
        });

        // Permitir guardar con Enter
        newUrlInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') saveUrl();
        });
    </script>

</body>
</html>
