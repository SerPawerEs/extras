<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendas</title>
    <link rel="stylesheet" href="styles.css">
</head><body>
    <div class="date-menu">
        <h2>Dirigete a cualquier agenda con su fecha</h2>
        <input type="date" id="fecha">
        <span>Fecha de la agenda</span>
        <div style="display: flex; width: 100%; align-items: center; justify-content: center; gap: 0.5em;">
            <select id="grado">
                <option value="" disabled selected hidden>Grado</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
                <option value="11">11</option>
            </select>
            <select id="salon">
                <option value="" disabled selected hidden>Curso</option>
                <option value="a">A</option>
                <option value="b">B</option>
                <option value="c">C</option>
                <option value="d">D</option>
                <option value="e">E</option>
            </select>
        </div>
        <span>Grado // Curso</span>
        <button style="display: none;" id="continue" onclick="redirect()">Continuar</button>
        <span id="error">Completa los campos y pulsa continuar</span>
        <span>ingreso a <a href="https://sagradobarranquilla.infinite.com.co/schoolweb/ingreso.aspx">SchoolWeb</a></span>
    </div>
    <script src="agenda.js"></script>
</body>
</html>
